name: Refresh law data

# PC 푸시 없이 법제처 데이터를 받아 js/ 캐시를 저장소에 커밋합니다.
# GitHub Pages는 커밋 후 자동으로 다시 배포됩니다.
#
# 실패 원인(과거): Actions IP → law.go.kr timed out (1시간+ 대기 후 실패)
# 해결: LAW_FETCH_PROXY(Cloudflare Worker)로 법제처·고용부 페이지를 대리 수집

on:
  schedule:
    # 매일 한국시간 오전 09:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "기준일 YYYY-MM-DD (비우면 오늘)"
        required: false
        default: ""
  repository_dispatch:
    types: [refresh-laws]

permissions:
  contents: write
  actions: read

concurrency:
  group: refresh-laws
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from law.go.kr and rebuild cache
        env:
          PYTHONIOENCODING: utf-8
          # Actions → 법제처 직행 타임아웃 우회 (Worker가 대신 받음)
          LAW_FETCH_PROXY: https://wandering-dew-09bd.shkim5.workers.dev
          LAW_FETCH_PROXY_SECRET: ${{ secrets.LAW_FETCH_PROXY_SECRET }}
          LAW_HTTP_TIMEOUT: "45"
        run: |
          set -e
          BASE="${{ github.event.inputs.base }}"
          if [ -z "$BASE" ]; then
            BASE="${{ github.event.client_payload.base }}"
          fi
          # CI에서는 내부 parity 생략(아래 단계에서 soft-fail로 별도 실행)
          if [ -n "$BASE" ]; then
            python3 _law_fetch/refresh_amendments.py --base "$BASE" --skip-parity
          else
            python3 _law_fetch/refresh_amendments.py --skip-parity
          fi

      # 검증 실패해도 수집 결과는 커밋
      - name: Parity simulation (법제처 대조)
        continue-on-error: true
        timeout-minutes: 8
        env:
          PYTHONIOENCODING: utf-8
          CI: "true"
          LAW_FETCH_PROXY: https://wandering-dew-09bd.shkim5.workers.dev
          LAW_FETCH_PROXY_SECRET: ${{ secrets.LAW_FETCH_PROXY_SECRET }}
          LAW_HTTP_TIMEOUT: "45"
        run: |
          python3 _law_fetch/verify_law_parity.py --soft || {
            echo "::warning::법제처 대조 검증에 실패했습니다. 수집 데이터는 커밋합니다."
            exit 0
          }

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: 법제처 기준 개정·조문 캐시 자동 갱신"
          file_pattern: |
            js/amendments-cache.json
            js/notices-cache.json
            js/resource-data.js
            js/law-articles.js
            js/law-articles-raw.json
            js/law-articles-seed.json
            _law_fetch/full-*.txt
            _law_fetch/_parity_report.json
